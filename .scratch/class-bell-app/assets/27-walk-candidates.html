<script>
const DEFS={"bucktooth": {"legs": [[5], [12], [7, 6, 27], [11, 10]], "tail": [0], "hide": [4]}, "corgi": {"legs": [[3, 4], [14, 15], [16, 17], [19, 22]], "tail": [34, 35], "hide": []}, "basset1": {"legs": [[26, 27], [28, 29], [52, 53], [54, 55]], "tail": [40, 41], "hide": []}, "basset2": {"legs": [[27, 28], [29, 30], [33, 34], [36, 37]], "tail": [35], "hide": []}, "gray": {"legs": [[29], [30], [34], [35]], "tail": [28], "hide": []}, "tan": {"legs": [[0], [6], [8], [9]], "tail": [10], "hide": []}, "brown": {"legs": [[0], [4], [9], [10]], "tail": [5], "hide": []}, "eating": {"legs": [[4], [5], [8], [9]], "tail": [3], "hide": []}}, freeze=new URLSearchParams(location.search).get('freeze'), rigs=[];
const shapes=svg=>[...svg.querySelectorAll('path,rect,circle,ellipse,polygon,polyline,line')].filter(e=>!e.closest('defs,clipPath,mask,pattern,symbol'));
document.querySelectorAll('figure').forEach(fig=>{
  const d=DEFS[fig.dataset.t];
  fig.querySelectorAll('svg').forEach(svg=>{if(!svg.getAttribute('viewBox'))svg.setAttribute('viewBox','0 0 '+parseFloat(svg.getAttribute('width'))+' '+parseFloat(svg.getAttribute('height')));svg.removeAttribute('width');svg.removeAttribute('height');const el=shapes(svg);d.hide.forEach(i=>el[i]&&(el[i].style.display='none'))});
  const el=shapes(fig.querySelector('.w svg')), sign=[1,-1,-1,1];
  const add=(idx,piv,f)=>{const els=idx.map(i=>el[i]).filter(Boolean);if(!els.length)return;const bx=els.map(e=>e.getBoundingClientRect());
    const u={l:Math.min(...bx.map(b=>b.left)),t:Math.min(...bx.map(b=>b.top)),r:Math.max(...bx.map(b=>b.right)),b:Math.max(...bx.map(b=>b.bottom))};
    const p={x:u.l+(u.r-u.l)*piv[0],y:u.t+(u.b-u.t)*piv[1]};
    els.forEach(e=>{const c=e.getScreenCTM();rigs.push({e,p,f,ctm:new DOMMatrix([c.a,c.b,c.c,c.d,c.e,c.f]),own:e.getAttribute('transform')||''})})};
  d.legs.forEach((idx,k)=>add(idx,[.5,0],t=>sign[k]*18*Math.sin(t*8)));
  add(d.tail,[.5,1],t=>10*Math.sin(t*8));
});
function frame(ms){const t=freeze?0.13:ms/1000;
  for(const it of rigs){const p=it.p,M=new DOMMatrix().translate(p.x,p.y).rotate(it.f(t)).translate(-p.x,-p.y),L=it.ctm.inverse().multiply(M).multiply(it.ctm);
    it.e.setAttribute('transform',(it.own+' matrix('+[L.a,L.b,L.c,L.d,L.e,L.f].map(n=>n.toFixed(5)).join(',')+')').trim())}
  if(!freeze)requestAnimationFrame(frame)}
requestAnimationFrame(frame);
